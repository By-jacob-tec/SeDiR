[package]
name = "sedir"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Wideband SDR receiver: spectrum, waterfall and click-to-listen demodulation"

[dependencies]
cpal = "0.18.2"
eframe = "0.35.0"
libloading = "0.9.0"
num-complex = "0.4"
rustfft = "6"
soapysdr = "0.5.1"
soapysdr-sys = "0.8.1"
sys-locale = "0.3"

[profile.dev]
# DSP at tens of MS/s is far too slow without optimisation.
opt-level = 2
